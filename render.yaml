services:
  - type: web
    name: stawi-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYAZA_MODE
        value: mock
      - key: AT_ENV
        value: sandbox
      - key: AT_CALLBACK_SECRET
        generateValue: true
      - key: SEED
        value: "true"
      - key: CORS_ORIGIN
        value: "*"
